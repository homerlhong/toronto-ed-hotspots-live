name: Collect Toronto Fire CAD
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: toronto-fire-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect verified Toronto Fire CAD
        run: python scripts/collect_dispatch.py
      - name: Commit collected samples
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dispatch-data.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Toronto Fire dispatch snapshot"
            git push
          fi
