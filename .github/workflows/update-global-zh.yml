name: Update Traditional Chinese Global Intelligence
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: global-zh-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve public data snapshots
        run: python3 scripts/update_global_zh.py
      - name: Commit updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add global-zh-data.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh Traditional Chinese global intelligence"
            git pull --rebase origin main
            git push
          fi
